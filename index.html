<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý bán hàng</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    margin:0;
    padding:15px;
}

.container{
    max-width:600px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:15px;
}

h1,h2,h3{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:8px;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:17px;
}

.date{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.date button{
    font-size:20px;
    padding:8px 15px;
}

.dateText{
    font-weight:bold;
    text-align:center;
}

.result{
    background:#f3f4f6;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}

.result p{
    display:flex;
    justify-content:space-between;
}

.big{
    font-size:22px;
    font-weight:bold;
    border-top:1px solid #ccc;
    padding-top:10px;
}

.save{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.stock{
    text-align:center;
}

.stockNumber{
    font-size:32px;
    font-weight:bold;
}


/* ================= 12 THÁNG ================= */

.thangNam{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.dsThang{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.thangBtn{
    border:0;
    background:#f3f4f6;
    padding:12px 5px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

.thangBtn:active{
    transform:scale(.97);
}

.thangBtn.active{
    background:#111827;
    color:white;
}

.thangDoanhSo{
    display:block;
    font-size:13px;
    margin-top:5px;
    font-weight:normal;
}

.chiTiet{
    display:none;
    margin-top:15px;
}

.chiTiet.hien{
    display:block;
}

.tieuDeChiTiet{
    font-weight:bold;
    font-size:18px;
    margin-bottom:10px;
}

.ngayItem{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    background:#f3f4f6;
    border-radius:10px;
    margin-bottom:8px;
}

.ngay{
    font-weight:bold;
}

.soBan{
    font-size:14px;
    color:#666;
    margin-top:5px;
}

.doanhSoNgay{
    font-weight:bold;
    text-align:right;
}

.khongCo{
    text-align:center;
    color:#777;
    padding:15px;
}

.namDieuKhien{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.namDieuKhien button{
    border:0;
    background:#f3f4f6;
    padding:8px 14px;
    border-radius:8px;
    font-size:18px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🥡 Quản lý bán hàng</h1>

<div class="date">

<button id="btnPrev">◀</button>

<div id="dateText" class="dateText"></div>

<button id="btnNext">▶</button>

</div>


<div class="grid">

<div>
<label>Tồn đầu</label>
<input id="tonDau" type="number" min="0">
</div>

<div>
<label>Nhập thêm</label>
<input id="nhap" type="number" min="0" value="0">
</div>

<div>
<label>Số bịch bán</label>
<input id="ban" type="number" min="0">
</div>

<div>
<label>Giá / bịch</label>
<input id="gia" type="number" min="0">
</div>

</div>


<div class="result">

<p>
<span>Tồn đầu</span>
<strong id="hienTonDau">0 bịch</strong>
</p>

<p>
<span>+ Nhập</span>
<strong id="hienNhap">0 bịch</strong>
</p>

<p>
<span>− Bán</span>
<strong id="hienBan">0 bịch</strong>
</p>

<p class="big">
<span>Tồn cuối</span>
<strong id="tonCuoi">0 bịch</strong>
</p>

</div>


<div class="result">

<p>
<span>Doanh số</span>
<strong id="doanhSo">0đ</strong>
</p>

</div>


<button id="btnSaveDay" class="save">
💾 LƯU NGÀY
</button>

</div>


<div class="card stock">

<h3>📦 Tồn hiện tại</h3>

<div id="tonHienTai" class="stockNumber">
0 bịch
</div>

</div>


<!-- ================= DOANH SỐ NĂM ================= -->

<div class="card">

<h3>📊 Doanh số năm</h3>


<div class="namDieuKhien">

<button id="btnNamTruoc">◀</button>

<div id="namHienTai" class="thangNam"></div>

<button id="btnNamSau">▶</button>

</div>


<div id="dsThang" class="dsThang"></div>


<!-- CHI TIẾT THÁNG -->

<div id="chiTiet" class="chiTiet">

<div id="tieuDeChiTiet" class="tieuDeChiTiet"></div>

<div id="danhSachNgay"></div>


<div class="result">

<p>
<span>Tổng bán</span>
<strong id="tongBanThang">0 bịch</strong>
</p>

<p class="big">
<span>Tổng doanh số</span>
<strong id="tongDoanhSoThang">0đ</strong>
</p>

</div>

</div>

</div>

</div>


<script>

const KEY = "APP_BAN_HANG";

let ngayDangChon = new Date();

let namDangXem =
    ngayDangChon.getFullYear();

let thangDangMo = null;


/* ================= DỮ LIỆU ================= */

function layDuLieu(){

    const data =
        localStorage.getItem(KEY);

    if(data === null){
        return {};
    }

    try{

        return JSON.parse(data);

    }catch(e){

        return {};

    }

}


function luuDuLieu(data){

    localStorage.setItem(
        KEY,
        JSON.stringify(data)
    );

}


/* ================= NGÀY ================= */

function maNgay(date){

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth()+1
        ).padStart(2,"0");

    const d =
        String(
            date.getDate()
        ).padStart(2,"0");

    return y+"-"+m+"-"+d;

}


function hienNgay(date){

    return date.toLocaleDateString(
        "vi-VN",
        {
            weekday:"long",
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


function tien(so){

    return new Intl.NumberFormat(
        "vi-VN"
    ).format(so)+"đ";

}


/* ================= TÍNH ================= */

function tinh(){

    const tonDau =
        Number(
            document.getElementById("tonDau").value
        ) || 0;

    const nhap =
        Number(
            document.getElementById("nhap").value
        ) || 0;

    const ban =
        Number(
            document.getElementById("ban").value
        ) || 0;

    const gia =
        Number(
            document.getElementById("gia").value
        ) || 0;


    const tonCuoi =
        tonDau + nhap - ban;

    const doanhSo =
        ban * gia;


    document.getElementById("hienTonDau").innerText =
        tonDau+" bịch";

    document.getElementById("hienNhap").innerText =
        nhap+" bịch";

    document.getElementById("hienBan").innerText =
        ban+" bịch";

    document.getElementById("tonCuoi").innerText =
        tonCuoi+" bịch";

    document.getElementById("doanhSo").innerText =
        tien(doanhSo);

    document.getElementById("tonHienTai").innerText =
        tonCuoi+" bịch";

}


/* ================= NGÀY TRƯỚC ================= */

function timNgayTruoc(){

    const data =
        layDuLieu();

    const hienTai =
        maNgay(ngayDangChon);


    const keys =
        Object.keys(data)
        .filter(function(key){

            return key < hienTai;

        })
        .sort();


    if(keys.length === 0){

        return null;

    }


    return data[
        keys[keys.length-1]
    ];

}


/* ================= TẢI NGÀY ================= */

function taiNgay(){

    const key =
        maNgay(ngayDangChon);


    document.getElementById("dateText").innerText =
        "📅 "+hienNgay(ngayDangChon);


    const data =
        layDuLieu();


    if(data[key]){

        document.getElementById("tonDau").value =
            data[key].tonDau;

        document.getElementById("nhap").value =
            data[key].nhap;

        document.getElementById("ban").value =
            data[key].ban;

        document.getElementById("gia").value =
            data[key].gia;

    }else{

        const truoc =
            timNgayTruoc();


        if(truoc){

            document.getElementById("tonDau").value =
                truoc.tonCuoi;

            document.getElementById("gia").value =
                truoc.gia;

        }else{

            document.getElementById("tonDau").value =
                "";

            document.getElementById("gia").value =
                "";

        }


        document.getElementById("nhap").value =
            0;

        document.getElementById("ban").value =
            "";

    }


    tinh();

}


/* ================= ĐỔI NGÀY ================= */

function doiNgay(so){

    ngayDangChon.setDate(
        ngayDangChon.getDate()+so
    );

    taiNgay();

}


/* ================= LƯU NGÀY ================= */

function luuNgay(){

    const tonDau =
        Number(
            document.getElementById("tonDau").value
        ) || 0;

    const nhap =
        Number(
            document.getElementById("nhap").value
        ) || 0;

    const ban =
        Number(
            document.getElementById("ban").value
        ) || 0;

    const gia =
        Number(
            document.getElementById("gia").value
        ) || 0;


    if(ban > tonDau + nhap){

        alert(
            "❌ Số bán vượt quá số tồn!"
        );

        return;

    }


    const tonCuoi =
        tonDau + nhap - ban;

    const doanhSo =
        ban * gia;


    const data =
        layDuLieu();


    const key =
        maNgay(ngayDangChon);


    data[key] = {

        tonDau:tonDau,

        nhap:nhap,

        ban:ban,

        gia:gia,

        tonCuoi:tonCuoi,

        doanhSo:doanhSo

    };


    luuDuLieu(data);


    tinh();

    hienThi12Thang();


    if(thangDangMo !== null){

        hienChiTietThang(
            thangDangMo
        );

    }


    alert(
        "✅ Đã lưu ngày!"
    );

}


/* ================= TỔNG THÁNG ================= */

function layTongThang(nam,thang){

    const data =
        layDuLieu();


    let tongBan = 0;

    let tongDoanhSo = 0;


    Object.keys(data).forEach(
        function(key){

            const p =
                key.split("-");


            const y =
                Number(p[0]);

            const m =
                Number(p[1])-1;


            if(
                y === nam &&
                m === thang
            ){

                tongBan +=
                    Number(
                        data[key].ban
                    ) || 0;


                tongDoanhSo +=
                    Number(
                        data[key].doanhSo
                    ) || 0;

            }

        }
    );


    return {

        tongBan:tongBan,

        tongDoanhSo:tongDoanhSo

    };

}


/* ================= HIỆN 12 THÁNG ================= */

function hienThi12Thang(){

    document.getElementById(
        "namHienTai"
    ).innerText =
        "Năm "+namDangXem;


    const box =
        document.getElementById("dsThang");


    let html = "";


    for(let i=0;i<12;i++){

        const tong =
            layTongThang(
                namDangXem,
                i
            );


        const soThang =
            String(i+1)
            .padStart(2,"0");


        const active =
            thangDangMo === i
            ? " active"
            : "";


        html += `

        <button
            class="thangBtn${active}"
            onclick="moThang(${i})"
        >

            T${soThang}

            <span class="thangDoanhSo">
                ${tien(tong.tongDoanhSo)}
            </span>

        </button>

        `;

    }


    box.innerHTML =
        html;

}


/* ================= MỞ THÁNG ================= */

function moThang(thang){

    if(thangDangMo === thang){

        thangDangMo = null;

        document.getElementById(
            "chiTiet"
        ).classList.remove("hien");

        hienThi12Thang();

        return;

    }


    thangDangMo =
        thang;


    hienThi12Thang();

    hienChiTietThang(
        thang
    );

}


/* ================= CHI TIẾT THÁNG ================= */

function hienChiTietThang(thang){

    const data =
        layDuLieu();


    let danhSach = [];

    let tongBan = 0;

    let tongDoanhSo = 0;


    Object.keys(data).forEach(
        function(key){

            const p =
                key.split("-");


            const y =
                Number(p[0]);

            const m =
                Number(p[1])-1;


            if(
                y === namDangXem &&
                m === thang
            ){

                const ban =
                    Number(
                        data[key].ban
                    ) || 0;


                const doanhSo =
                    Number(
                        data[key].doanhSo
                    ) || 0;


                tongBan += ban;

                tongDoanhSo +=
                    doanhSo;


                danhSach.push({

                    key:key,

                    ban:ban,

                    doanhSo:doanhSo

                });

            }

        }
    );


    danhSach.sort(
        function(a,b){

            return a.key.localeCompare(
                b.key
            );

        }
    );


    const soThang =
        String(thang+1)
        .padStart(2,"0");


    document.getElementById(
        "tieuDeChiTiet"
    ).innerText =
        "📅 Chi tiết tháng "+
        soThang+
        "/"+
        namDangXem;


    const danhSachNgay =
        document.getElementById(
            "danhSachNgay"
        );


    if(danhSach.length === 0){

        danhSachNgay.innerHTML =
            '<div class="khongCo">Chưa có dữ liệu trong tháng này</div>';

    }else{

        let html = "";


        danhSach.forEach(
            function(item){

                const p =
                    item.key.split("-");


                const ngay =
                    p[2]+"/"+
                    p[1]+"/"+
                    p[0];


                html += `

                <div class="ngayItem">

                    <div>

                        <div class="ngay">
                            📅 ${ngay}
                        </div>

                        <div class="soBan">
                            Đã bán: ${item.ban} bịch
                        </div>

                    </div>

                    <div class="doanhSoNgay">
                        ${tien(item.doanhSo)}
                    </div>

                </div>

                `;

            }
        );


        danhSachNgay.innerHTML =
            html;

    }


    document.getElementById(
        "tongBanThang"
    ).innerText =
        tongBan+" bịch";


    document.getElementById(
        "tongDoanhSoThang"
    ).innerText =
        tien(tongDoanhSo);


    document.getElementById(
        "chiTiet"
    ).classList.add("hien");

}


/* ================= ĐỔI NĂM ================= */

function doiNam(so){

    namDangXem += so;

    thangDangMo = null;


    document.getElementById(
        "chiTiet"
    ).classList.remove("hien");


    hienThi12Thang();

}


/* ================= SỰ KIỆN ================= */

document.getElementById(
    "btnPrev"
).addEventListener(
    "click",
    function(){

        doiNgay(-1);

    }
);


document.getElementById(
    "btnNext"
).addEventListener(
    "click",
    function(){

        doiNgay(1);

    }
);


document.getElementById(
    "btnSaveDay"
).addEventListener(
    "click",
    luuNgay
);


document.getElementById(
    "btnNamTruoc"
).addEventListener(
    "click",
    function(){

        doiNam(-1);

    }
);


document.getElementById(
    "btnNamSau"
).addEventListener(
    "click",
    function(){

        doiNam(1);

    }
);


document.getElementById(
    "tonDau"
).addEventListener(
    "input",
    tinh
);


document.getElementById(
    "nhap"
).addEventListener(
    "input",
    tinh
);


document.getElementById(
    "ban"
).addEventListener(
    "input",
    tinh
);


document.getElementById(
    "gia"
).addEventListener(
    "input",
    tinh
);


/* ================= KHỞI ĐỘNG ================= */

taiNgay();

tinh();

hienThi12Thang();


/* ================= OFFLINE ================= */

if("serviceWorker" in navigator){

    navigator.serviceWorker.register(
        "./sw.js"
    ).catch(
        function(error){

            console.log(
                "Service Worker:",
                error
            );

        }
    );

}

</script>

</body>
</html>
