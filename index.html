<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý bán hàng</title>

<style>
*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    margin:0;
    padding:15px;
}

.container{
    max-width:600px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:15px;
}

h1{
    margin-top:0;
}

h2,h3{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:8px;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:17px;
}

.date{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.date button{
    font-size:20px;
    padding:8px 15px;
}

.dateText{
    font-weight:bold;
    text-align:center;
}

.result{
    background:#f3f4f6;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}

.result p{
    display:flex;
    justify-content:space-between;
}

.big{
    font-size:22px;
    font-weight:bold;
    border-top:1px solid #ccc;
    padding-top:10px;
}

.save,
.primary{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.save{
    background:#111827;
}

.primary{
    background:#2563eb;
}

.danger{
    background:#dc2626;
    color:white;
    border:0;
    padding:8px 12px;
    border-radius:8px;
}

.stock{
    text-align:center;
}

.stockNumber{
    font-size:32px;
    font-weight:bold;
}

.product-item{
    border:1px solid #ddd;
    padding:15px;
    margin-top:12px;
    border-radius:12px;
    background:#f9fafb;
}

.product-name{
    font-size:19px;
    font-weight:bold;
    margin-bottom:8px;
}

.product-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.product-actions button{
    flex:1;
    padding:10px;
    border:0;
    border-radius:8px;
}

.edit-btn{
    background:#f59e0b;
    color:white;
}

.delete-btn{
    background:#dc2626;
    color:white;
}
</style>
</head>

<!-- ================= BÁN HÀNG ================= -->

<div>
<label>Số bịch bán</label>

</div>

<div>
<label>Giá / bịch</label>
<input id="gia" type="number" min="0">

</div>
<div class="result">

</p>

<p>
<span>+ Nhập</span>
<strong id="hienNhap">0 bịch</strong>
</p>

<span>− Bán</span>
<strong id="hienBan">0 bịch</strong>
</p>

<p class="big">
<span>Tồn cuối</span>
<strong id="tonCuoi">0 bịch</strong>
</p>

</div>

<div class="result">

<p>
<span>Doanh số</span>
<strong id="doanhSo">0đ</strong>
</p>

</div>

<button id="btnSaveDay" class="save">
💾 LƯU NGÀY
</button>

</div>


<!-- ================= TỒN HIỆN TẠI ================= -->

<button id="btnSaveProduct" class="save">

</div>


<!-- DANH SÁCH -->

<div id="productList"></div>

</div>

</div>

</div>

        return {};

    ).padStart(2,"0");

    return y+"-"+m+"-"+d;
}

function tinh(){

    const tonDau =

}


function timNgayTruoc(){

    const data = layDuLieu();

    const hienTai =
        maNgay(ngayDangChon);

    const keys =
        Object.keys(data)
        .filter(function(key){
            return key < hienTai;
        })
        .sort();

    if(keys.length === 0){
        return null;
    }

    return data[
        keys[keys.length-1]
    ];

}


function taiNgay(){

    const key =
        maNgay(ngayDangChon);

    document.getElementById("dateText").innerText =
        "📅 "+hienNgay(ngayDangChon);

    const data =
        layDuLieu();


    if(data[key]){

        document.getElementById("tonDau").value =
            data[key].tonDau;

        document.getElementById("nhap").value =
            data[key].nhap;

        document.getElementById("ban").value =
            data[key].ban;

        document.getElementById("gia").value =
            data[key].gia;

    }else{

        const truoc =
            timNgayTruoc();

        if(truoc){

            document.getElementById("tonDau").value =
                truoc.tonCuoi;

            document.getElementById("gia").value =
                truoc.gia;

        }else{

            document.getElementById("tonDau").value = "";

            document.getElementById("gia").value = "";

        }

        document.getElementById("nhap").value = 0;

        document.getElementById("ban").value = "";

    }

    tinh();

}


function doiNgay(so){

    ngayDangChon.setDate(
        ngayDangChon.getDate()+so
    );

    taiNgay();

}


function luuNgay(){

    const tonDau =
        Number(
            document.getElementById("tonDau").value
        ) || 0;

    const nhap =
        Number(
            document.getElementById("nhap").value
        ) || 0;

    const ban =
        Number(
            document.getElementById("ban").value
        ) || 0;

    const gia =
        Number(
            document.getElementById("gia").value
        ) || 0;
    if(ban > tonDau + nhap){

        alert("❌ Số bán vượt quá số tồn!");

        return;
    }

    const tonCuoi =
        tonDau + nhap - ban;

    const doanhSo =
        ban * gia;

    const data =
        layDuLieu();

    const key =
        maNgay(ngayDangChon);

    data[key] = {
        tonDau: tonDau,
        nhap: nhap,
        ban: ban,
        gia: gia,
        tonCuoi: tonCuoi,
        doanhSo: doanhSo
    };

    luuDuLieu(data);

    tinh();
    tinhThang();

    alert("✅ Đã lưu ngày!");
}


function tinhThang(){

    const data =
        layDuLieu();

    const nam =
        ngayDangChon.getFullYear();

    const thang =
        ngayDangChon.getMonth();

    let tongBan = 0;
    let tongDoanhSo = 0;

    Object.keys(data).forEach(function(key){

        const p = key.split("-");

        const y = Number(p[0]);
        const m = Number(p[1]) - 1;

        if(y === nam && m === thang){

            tongBan +=
                Number(data[key].ban) || 0;

            tongDoanhSo +=
                Number(data[key].doanhSo) || 0;
        }

    });

    document.getElementById("thang").innerText =
        "📅 Tháng " +
        String(thang + 1).padStart(2,"0") +
        "/" +
        nam;

    document.getElementById("tongBan").innerText =
        tongBan + " bịch";

    document.getElementById("tongDoanhSo").innerText =
        tien(tongDoanhSo);
