<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý bán hàng</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    margin:0;
    padding:15px;
}

.container{
    max-width:600px;
    margin:auto;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:15px;
}

h1{
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

label{
    font-weight:bold;
    display:block;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:17px;
}

.date{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.date button{
    font-size:20px;
    padding:8px 15px;
}

.dateText{
    font-weight:bold;
    text-align:center;
}

.result{
    background:#f3f4f6;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}

.result p{
    display:flex;
    justify-content:space-between;
}

.big{
    font-size:22px;
    font-weight:bold;
    border-top:1px solid #ccc;
    padding-top:10px;
}

.save{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.stock{
    text-align:center;
}

.stockNumber{
    font-size:32px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🥡 Quản lý bán hàng</h1>
    <div style="margin:15px 0;">
 <button onclick="document.getElementById('productSection').style.display='block'; document.getElementById('productSection').scrollIntoView({behavior:'smooth'});"
    style="width:100%;padding:14px;border:0;border-radius:10px;background:#2563eb;color:white;font-size:17px;font-weight:bold;">
    📦 DANH MỤC SẢN PHẨM
  </button>
</div>

<div class="date">

<button onclick="doiNgay(-1)">◀</button>

<div id="dateText" class="dateText"></div>

<button onclick="doiNgay(1)">▶</button>

</div>


<div class="grid">

<div>
<label>Tồn đầu</label>
<input id="tonDau" type="number" min="0">
</div>

<div>
<label>Nhập thêm</label>
<input id="nhap" type="number" min="0" value="0">
</div>

<div>
<label>Số bịch bán</label>
<input id="ban" type="number" min="0">
</div>

<div>
<label>Giá / bịch</label>
<input id="gia" type="number" min="0">
</div>

</div>


<div class="result">

<p>
<span>Tồn đầu</span>
<strong id="hienTonDau">0</strong>
</p>

<p>
<span>+ Nhập</span>
<strong id="hienNhap">0</strong>
</p>

<p>
<span>− Bán</span>
<strong id="hienBan">0</strong>
</p>

<p class="big">
<span>Tồn cuối</span>
<strong id="tonCuoi">0</strong>
</p>

</div>


<div class="result">

<p>
<span>Doanh số</span>
<strong id="doanhSo">0đ</strong>
</p>

</div>


<button class="save" onclick="luuNgay()">
💾 LƯU NGÀY
</button>

</div>


<div class="card stock">

<h3>📦 Tồn hiện tại</h3>

<div id="tonHienTai" class="stockNumber">
0 bịch
</div>

</div>


<div class="card">

<h3>📊 Doanh số tháng</h3>

<div id="thang"></div>

<div class="result">

<p>
<span>Tổng bán</span>
<strong id="tongBan">0 bịch</strong>
</p>

<p class="big">
<span>Tổng doanh số</span>
<strong id="tongDoanhSo">0đ</strong>
</p>

</div>

</div>

</div>


<script>

const KEY = "APP_BAN_HANG";


let ngayDangChon = new Date();


function layDuLieu(){

    const data = localStorage.getItem(KEY);

    if(data === null){
        return {};
    }

    return JSON.parse(data);
}


function luuDuLieu(data){

    localStorage.setItem(
        KEY,
        JSON.stringify(data)
    );
}


function maNgay(date){

    const y = date.getFullYear();

    const m = String(
        date.getMonth()+1
    ).padStart(2,"0");

    const d = String(
        date.getDate()
    ).padStart(2,"0");

    return y+"-"+m+"-"+d;
}


function hienNgay(date){

    return date.toLocaleDateString(
        "vi-VN",
        {
            weekday:"long",
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );
}


function tien(so){

    return new Intl.NumberFormat(
        "vi-VN"
    ).format(so)+"đ";
}


function tinh(){

    const tonDau =
        Number(
            document.getElementById("tonDau").value
        ) || 0;


    const nhap =
        Number(
            document.getElementById("nhap").value
        ) || 0;


    const ban =
        Number(
            document.getElementById("ban").value
        ) || 0;


    const gia =
        Number(
            document.getElementById("gia").value
        ) || 0;


    const tonCuoi =
        tonDau + nhap - ban;


    const doanhSo =
        ban * gia;


    document.getElementById(
        "hienTonDau"
    ).innerText =
        tonDau+" bịch";


    document.getElementById(
        "hienNhap"
    ).innerText =
        nhap+" bịch";


    document.getElementById(
        "hienBan"
    ).innerText =
        ban+" bịch";


    document.getElementById(
        "tonCuoi"
    ).innerText =
        tonCuoi+" bịch";


    document.getElementById(
        "doanhSo"
    ).innerText =
        tien(doanhSo);


    document.getElementById(
        "tonHienTai"
    ).innerText =
        tonCuoi+" bịch";
}


function timNgayTruoc(){

    const data = layDuLieu();

    const hienTai =
        maNgay(ngayDangChon);


    const keys =
        Object.keys(data)
        .filter(function(key){

            return key < hienTai;

        })
        .sort();


    if(keys.length === 0){

        return null;

    }


    return data[
        keys[keys.length-1]
    ];
}


function taiNgay(){

    const key =
        maNgay(ngayDangChon);


    document.getElementById(
        "dateText"
    ).innerText =
        "📅 "+hienNgay(ngayDangChon);


    const data =
        layDuLieu();


    if(data[key]){

        document.getElementById(
            "tonDau"
        ).value =
            data[key].tonDau;


        document.getElementById(
            "nhap"
        ).value =
            data[key].nhap;


        document.getElementById(
            "ban"
        ).value =
            data[key].ban;


        document.getElementById(
            "gia"
        ).value =
data[key].gia;

    }else{

        const truoc =
            timNgayTruoc();


        if(truoc){

            document.getElementById(
                "tonDau"
            ).value =
                truoc.tonCuoi;


            document.getElementById(
                "gia"
            ).value =
                truoc.gia;

        }else{

            document.getElementById(
                "tonDau"
            ).value = "";

            document.getElementById(
                "gia"
            ).value = "";

        }


        document.getElementById(
            "nhap"
        ).value = 0;


        document.getElementById(
            "ban"
        ).value = "";

    }


    tinh();

}


function doiNgay(so){

    ngayDangChon.setDate(
        ngayDangChon.getDate()+so
    );

    taiNgay();

}


function luuNgay(){

    const tonDau =
        Number(
            document.getElementById("tonDau").value
        ) || 0;


    const nhap =
        Number(
            document.getElementById("nhap").value
        ) || 0;


    const ban =
        Number(
            document.getElementById("ban").value
        ) || 0;


    const gia =
        Number(
            document.getElementById("gia").value
        ) || 0;


    if(ban > tonDau + nhap){

        alert(
            "❌ Số bán vượt quá số tồn!"
        );

        return;

    }


    const tonCuoi =
        tonDau + nhap - ban;


    const doanhSo =
        ban * gia;


    const data =
        layDuLieu();


    const key =
        maNgay(ngayDangChon);


    data[key] = {

        tonDau:tonDau,

        nhap:nhap,

        ban:ban,

        gia:gia,

        tonCuoi:tonCuoi,

        doanhSo:doanhSo

    };


    luuDuLieu(data);


    tinh();

    tinhThang();


    alert(
        "✅ Đã lưu ngày!"
    );

}


function tinhThang(){

    const data =
        layDuLieu();


    const nam =
        ngayDangChon.getFullYear();


    const thang =
        ngayDangChon.getMonth();


    let tongBan = 0;

    let tongDoanhSo = 0;


    Object.keys(data).forEach(
        function(key){

            const p =
                key.split("-");


            const y =
                Number(p[0]);


            const m =
                Number(p[1])-1;


            if(
                y === nam &&
                m === thang
            ){

                tongBan +=
                    Number(data[key].ban) || 0;


                tongDoanhSo +=
                    Number(data[key].doanhSo) || 0;

            }

        }
    );


    document.getElementById(
        "thang"
    ).innerText =
        "📅 Tháng "+
        String(thang+1).padStart(2,"0")+
        "/"+
        nam;


    document.getElementById(
        "tongBan"
    ).innerText =
        tongBan+" bịch";


    document.getElementById(
        "tongDoanhSo"
    ).innerText =
        tien(tongDoanhSo);

}


/* TỰ TÍNH */

document.getElementById(
    "tonDau"
).addEventListener(
    "input",
tinh
);


document.getElementById(
    "nhap"
).addEventListener(
    "input",
    tinh
);


document.getElementById(
    "ban"
).addEventListener(
    "input",
    tinh
);


document.getElementById(
    "gia"
).addEventListener(
    "input",
    tinh
);


/* CHẠY APP */

taiNgay();

tinhThang();

tinh();

</script>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js");
}
</script>

    

  <div id="productForm" style="display:none;">
    <input id="productName" placeholder="Tên sản phẩm"
      style="display:block; width:100%; padding:10px; margin:8px 0;">

    <input id="productCode" placeholder="Mã sản phẩm"
      style="display:block; width:100%; padding:10px; margin:8px 0;">

    <input id="productUnit" placeholder="Đơn vị tính"
      style="display:block; width:100%; padding:10px; margin:8px 0;">

    <input id="productPrice" type="number" placeholder="Giá bán"
      style="display:block; width:100%; padding:10px; margin:8px 0;">

    <input id="productStock" type="number" placeholder="Số lượng tồn"
      style="display:block; width:100%; padding:10px; margin:8px 0;">

    <button onclick="saveProduct()"
      style="padding:10px 15px;">
      💾 Lưu sản phẩm
    </button>
  </div>

  <div id="productList" style="margin-top:20px;"></div>
</div>

<script>
let products = JSON.parse(localStorage.getItem("products") || "[]");

function showAddProduct() {
  document.getElementById("productForm").style.display = "block";
}
    function showProducts() {
  document.getElementById("productSection").style.display = "block";
}
}

function saveProduct() {
  const name = document.getElementById("productName").value.trim();
  const code = document.getElementById("productCode").value.trim();
  const unit = document.getElementById("productUnit").value.trim();
  const price = document.getElementById("productPrice").value;
  const stock = document.getElementById("productStock").value;

  if (!name) {
    alert("Vui lòng nhập tên sản phẩm!");
    return;
  }

  products.push({
    name: name,
    code: code,
    unit: unit,
    price: price,
    stock: stock
  });

  localStorage.setItem("products", JSON.stringify(products));

  document.getElementById("productName").value = "";
  document.getElementById("productCode").value = "";
  document.getElementById("productUnit").value = "";
  document.getElementById("productPrice").value = "";
  document.getElementById("productStock").value = "";

  document.getElementById("productForm").style.display = "none";

  displayProducts();
}

function displayProducts() {
  const list = document.getElementById("productList");

  if (products.length === 0) {
    list.innerHTML = "<p>Chưa có sản phẩm nào.</p>";
    return;
  }

  list.innerHTML = products.map((p, index) => `
    <div style="border:1px solid #ddd; padding:12px; margin-bottom:10px; border-radius:8px;">
      <b>${p.name}</b><br>
      Mã: ${p.code || "-"}<br>
      Đơn vị: ${p.unit || "-"}<br>
      Giá bán: ${p.price || 0}<br>
      Tồn kho: ${p.stock || 0}
    </div>
  `).join("");
}

displayProducts();
</script>
</body>
</html>
